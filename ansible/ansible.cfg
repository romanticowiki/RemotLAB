##############################################################################
# Configuracion de Ansible para AulaRemota.
#
# Se usa automaticamente al lanzar cualquier comando DESDE este directorio.
# Si lo ejecutas desde la raiz del repo, Ansible no lo encuentra:
#   cd ansible && ansible-playbook site.yml
##############################################################################

[defaults]
inventory  = inventory/hosts.yml
roles_path = roles

# SIN Ansible Vault en este despliegue.
#
# El repo original cifraba los secretos con Vault y la contrasena vivia en
# ~/.vault-aularemota, fuera del repo. En una instalacion nueva no se tiene esa
# contrasena, asi que cualquier comando moria al intentar descifrar vault.yml.
#
# Ahora los secretos van en inventory/group_vars/lab/secrets.yml, un fichero
# EN CLARO que .gitignore excluye. Nunca se commitea.
#
# Si mas adelante quieres volver a cifrarlos:
#   ansible-vault encrypt inventory/group_vars/lab/secrets.yml
#   y descomenta la linea siguiente con tu fichero de contrasena.
# vault_password_file = ~/.vault-aula-remota

# DESACTIVADO A PROPOSITO, no por pereza.
#
# El nombre DNS (lab.example.com) es estable, pero la instancia se
# recrea con "terraform apply" y cada instancia nueva genera claves SSH de host
# nuevas. Con la comprobacion activada, el primer ansible-playbook despues de
# cada reconstruccion muere con "REMOTE HOST IDENTIFICATION HAS CHANGED" y hay
# que hacer ssh-keygen -R a mano: justo el paso manual que este proyecto quiere
# eliminar.
#
# El riesgo aceptado es un man-in-the-middle en la primera conexion. Se asume
# porque el host es efimero, de laboratorio, y el puerto 22 solo esta abierto
# a admin_cidr en el security group.
host_key_checking = False

# Ubuntu 22.04 trae Python 3.10 en /usr/bin/python3. Fijarlo evita el warning
# de descubrimiento del interprete en cada ejecucion.
interpreter_python = /usr/bin/python3

# Salida legible: los diccionarios y los stdout multilinea salen en YAML en vez
# de en una sola linea con \n literales.
result_format    = yaml
callbacks_enabled = ansible.posix.profile_tasks

forks               = 10
retry_files_enabled = False

# Timeout de conexion y de escalada de privilegios.
#
# El valor por defecto (10s) esta pensado para una maquina que responde rapido.
# En t3.micro (1 GiB, con swap sobre EBS) el "Gathering Facts" tarda 64s y
# cualquier tarea con apt supera de sobra ese margen: Ansible corta con
# "Timeout (12s) waiting for privilege escalation prompt", que suena a problema
# de sudo y no lo es.
#
# Si se sube la instancia a una con mas memoria, este valor se puede volver a
# bajar; no estorba dejarlo alto.
timeout = 60

[privilege_escalation]
become        = True
become_method = sudo

[ssh_connection]
pipelining = True

# MULTIPLEXADO SSH DESACTIVADO A PROPOSITO
#
# El repo original traia "-o ControlMaster=auto -o ControlPersist=120s", que
# reutiliza una sola conexion SSH para todas las tareas y ahorra minutos en un
# playbook largo. Desde un nodo de control en WSL resulto poco fiable: fallaba
# 3 de cada 6 ejecuciones con
#   "Timeout (Ns) waiting for privilege escalation prompt"
# o con
#   "Data could not be sent to remote host"
# aunque sudo funcionara perfectamente por SSH a mano y la maquina estuviera
# ociosa (load 0.08, SSH respondiendo en 2.5 s).
#
# El sintoma enganya: parece un problema de sudo o de la instancia, y es del
# socket de control, que queda a medias cuando un playbook se interrumpe y el
# siguiente intento lo reutiliza ya muerto.
#
# Mover el socket a /dev/shm reducia la frecuencia pero no lo eliminaba.
# Medido sin multiplexado: la recogida de facts pasa de 3 s a 13 s. Se acepta
# ese coste: un playbook que tarda un poco mas pero termina siempre vale mas
# que uno rapido que falla una de cada dos veces.
#
# Desde un nodo de control Linux nativo se puede volver a activar.
ssh_args = -o ServerAliveInterval=30 -o ServerAliveCountMax=6
