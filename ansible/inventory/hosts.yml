##############################################################################
# Inventario.
#
# Se usa el NOMBRE DNS de No-IP, no la IP publica.
#
# OJO: Terraform ya NO gestiona este registro. Despues de cada "terraform
# apply" hay que entrar al proveedor DNS y apuntar lab.example.com a la
# Elastic IP nueva (output "eip_public_ip"). Si no, Ansible no conecta.
#
# Mientras el DNS propaga puedes forzar la IP sin tocar este fichero:
#   ansible-playbook site.yml -i "<IP_PUBLICA>," -e ansible_user=ubuntu
#
# El grupo se llama "lab" y de ahi sale la ruta group_vars/lab/.
##############################################################################
---
all:
  children:
    lab:
      hosts:
        lab.example.com:
      vars:
        ansible_user: ubuntu
        ansible_ssh_private_key_file: ~/.ssh/aula-remota-key.pem
