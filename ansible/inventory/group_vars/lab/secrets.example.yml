##############################################################################
# PLANTILLA de secretos. Este fichero SI se commitea; no lleva secretos reales.
#
# Copialo y rellena el de verdad, que .gitignore excluye:
#   cp secrets.example.yml secrets.yml
#
# Todo fichero dentro de group_vars/lab/ se carga solo, sin tener que
# declararlo en ningun sitio.
#
# Genera contrasenas con:
#   openssl rand -base64 24
#
# OJO con VNC: el protocolo clasico TRUNCA la contrasena a 8 caracteres. Poner
# una mas larga no da error, simplemente se ignora a partir del octavo.
##############################################################################
---

# --- MariaDB -----------------------------------------------------------------
mysql_root_password: "CAMBIAME-root"
mysql_user_password: "CAMBIAME-guac"

# --- Usuarios Linux del laboratorio -----------------------------------------
# Una entrada por cada usuario de usuarios_lab (main.yml).
pw_linux:
  alumno1:  "CAMBIAME-alumno1"
  maestro1: "CAMBIAME-maestro1"

# Salt FIJO para el hash de las contrasenas Linux.
#
# No es paranoia: sin salt fijo, password_hash genera uno aleatorio en cada
# ejecucion, el hash sale distinto siempre y la tarea reporta "changed" en
# todos los playbooks. Con salt fijo la segunda pasada sale changed=0.
#
# Exactamente 16 caracteres de [a-zA-Z0-9./]:
#   openssl rand -base64 12 | tr -d '=+' | cut -c1-16
salt_linux: "CAMBIAME16CHARS."

# --- Contrasenas de VNC (maximo 8 caracteres utiles) -------------------------
pw_vnc:
  alumno1:  "CAMBIA01"
  maestro1: "CAMBIAM1"

# --- Token de la API de supervision -----------------------------------------
# Lo usa la app movil en la cabecera "Authorization: Bearer <token>".
# Minimo 24 caracteres:
#   openssl rand -base64 32
api_token: "CAMBIAME-token-de-la-api-minimo-24"

# Contrasena del usuario "supervisor" de Guacamole, con el que la API abre
# escritorios para la app movil. Solo tiene permiso READ sobre las conexiones.
#   openssl rand -base64 24
guac_supervisor_password: "CAMBIAME_minimo_16_caracteres"
